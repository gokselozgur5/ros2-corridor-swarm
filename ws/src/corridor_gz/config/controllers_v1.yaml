/v1/controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    diff_drive:
      type: diff_drive_controller/DiffDriveController

/v1/diff_drive:
  ros__parameters:
    use_sim_time: true
    left_wheel_names: ["v1/front_left_wheel_joint", "v1/rear_left_wheel_joint"]
    right_wheel_names: ["v1/front_right_wheel_joint", "v1/rear_right_wheel_joint"]
    wheel_separation: 0.80
    wheel_radius: 0.20
    wheels_per_side: 2
    odom_frame_id: v1/odom
    base_frame_id: v1/base_footprint
    enable_odom_tf: true
    publish_rate: 50.0
    cmd_vel_timeout: 0.5
    linear.x.max_velocity: 4.0
    linear.x.min_velocity: -2.0
    linear.x.max_acceleration: 2.0
    angular.z.max_velocity: 2.0
    angular.z.min_velocity: -2.0
    angular.z.max_acceleration: 3.0
